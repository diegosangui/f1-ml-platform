name: F1 Data Extraction

on:
  schedule:
    # Executa toda segunda-feira as 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    # Permite execucao manual pela interface do GitHub

jobs:
  extract-api:
    name: Extract from OpenF1 API -> S3
    runs-on: ubuntu-latest

    env:
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ENDPOINT_BUCKET: ${{ secrets.ENDPOINT_BUCKET }}
      REGION: ${{ secrets.REGION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Executar extract_api.py
        working-directory: src
        run: uv run extract_api.py

  extract-bucket:
    name: Extract from S3 -> Database
    runs-on: ubuntu-latest
    needs: extract-api

    env:
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ENDPOINT_BUCKET: ${{ secrets.ENDPOINT_BUCKET }}
      REGION: ${{ secrets.REGION }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Executar extract_bucket.py
        working-directory: src
        run: uv run extract_bucket.py

  dbt-run:
    name: dbt run - Transform Data
    runs-on: ubuntu-latest
    needs: extract-bucket

    env:
      DB_HOST: ${{ secrets.DB_HOST || '' }}
      DB_PORT: ${{ secrets.DB_PORT || '' }}
      DB_USER: ${{ secrets.DB_USER || '' }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || '' }}
      DB_NAME: ${{ secrets.DB_NAME || '' }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync

      - name: Criar profiles.yml do dbt
        run: |
          cat > ${{ github.workspace }}/dbt/profiles.yml << 'EOF'
          f1_ml_platform:
            target: prod
            outputs:
              prod:
                type: postgres
                host: "{{ env_var('DB_HOST') }}"
                port: "{{ env_var('DB_PORT') | int }}"
                user: "{{ env_var('DB_USER') }}"
                password: "{{ env_var('DB_PASSWORD') }}"
                dbname: "{{ env_var('DB_NAME') }}"
                schema: public
                threads: 4
          EOF

      - name: Executar dbt run
        working-directory: dbt
        run: uv run dbt run

      - name: Executar dbt test
        working-directory: dbt
        run: uv run dbt test
